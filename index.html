<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>사진기록</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            touch-action: manipulation; 
            background-color: #f5f7fa;
        }
    </style>
</head>
<body class="bg-[#f5f7fa]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 색상 상수 정의 ---
        const COLORS = {
            primary: '#1e88e5',    // 차분한 딥 블루
            accent: '#00a86b',     // 청록색
            bg: '#f5f7fa',         // 밝은 회색 배경
            textMain: '#333333',   // 기본 텍스트
            textSub: '#888888',    // 보조 텍스트
            border: '#e0e0e0'      // 테두리
        };

        // --- IndexedDB 관리 함수 ---
        const DB_NAME = 'PhotoLogDB';
        const STORE_NAME = 'photos';
        const DB_VERSION = 1;

        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = (event) => reject("Database error: " + event.target.errorCode);
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: "date" });
                    }
                };
                request.onsuccess = (event) => resolve(event.target.result);
            });
        };

        const saveToDB = async (dateKey, imageData) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], "readwrite");
                const store = transaction.objectStore(STORE_NAME);
                const request = store.put({ date: dateKey, image: imageData });
                request.onsuccess = () => resolve(true);
                request.onerror = () => reject("Save failed");
            });
        };

        const loadFromDB = async () => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], "readonly");
                const store = transaction.objectStore(STORE_NAME);
                const request = store.getAll();
                request.onsuccess = () => {
                    const photosObj = {};
                    request.result.forEach(item => {
                        photosObj[item.date] = item.image;
                    });
                    resolve(photosObj);
                };
                request.onerror = () => reject("Load failed");
            });
        };

        const deleteFromDB = async (dateKey) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], "readwrite");
                const store = transaction.objectStore(STORE_NAME);
                const request = store.delete(dateKey);
                request.onsuccess = () => resolve(true);
                request.onerror = () => reject("Delete failed");
            });
        };

        // --- 이미지 압축 유틸리티 ---
        const compressImage = (file, maxWidth = 1920, quality = 0.9) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = (maxWidth / width) * height;
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
            });
        };

        // --- 유틸리티 함수 ---
        const generateCalendar = (year, month) => {
            const startDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const calendar = [];
            let week = Array(startDay).fill(null);

            for (let day = 1; day <= daysInMonth; day++) {
                week.push(day);
                if (week.length === 7) {
                    calendar.push(week);
                    week = [];
                }
            }
            if (week.length > 0) {
                while (week.length < 7) week.push(null);
                calendar.push(week);
            }
            return calendar;
        };

        const formatDateKey = (year, month, day) => {
            if (!day) return null;
            return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        };

        // --- 메인 컴포넌트 ---
        function App() {
            const [currentDate, setCurrentDate] = useState(new Date());
            const [selectedDate, setSelectedDate] = useState(new Date().getDate());
            const [photos, setPhotos] = useState({}); 
            const [viewMode, setViewMode] = useState('calendar'); 
            const [compareMode, setCompareMode] = useState('gallery'); 
            const [splitSelection, setSplitSelection] = useState([null, null]); 
            const [loading, setLoading] = useState(true);
            
            const scrollRef = useRef(null);

            const today = new Date();
            const isToday = (day) => {
                return day === today.getDate() && 
                    currentDate.getMonth() === today.getMonth() && 
                    currentDate.getFullYear() === today.getFullYear();
            };

            useEffect(() => {
                const loadData = async () => {
                    try {
                        const savedPhotos = await loadFromDB();
                        setPhotos(savedPhotos);
                    } catch (e) {
                        console.error("데이터베이스 로드 실패", e);
                    } finally {
                        setLoading(false);
                    }
                };
                loadData();
            }, []);

            useEffect(() => {
                if (viewMode === 'compare' && compareMode === 'gallery' && scrollRef.current) {
                    setTimeout(() => {
                        if (scrollRef.current) {
                            scrollRef.current.scrollLeft = scrollRef.current.scrollWidth;
                        }
                    }, 0);
                }
            }, [viewMode, compareMode]);

            const handlePhotoUpload = async (e) => {
                const file = e.target.files[0];
                if (!file || !selectedDate) return;

                try {
                    const compressedDataUrl = await compressImage(file);
                    const dateKey = formatDateKey(currentDate.getFullYear(), currentDate.getMonth(), selectedDate);
                    await saveToDB(dateKey, compressedDataUrl);
                    setPhotos(prev => ({ ...prev, [dateKey]: compressedDataUrl }));
                } catch (error) {
                    alert("사진 저장 중 오류가 발생했습니다: " + error);
                }
            };

            const handleDeletePhoto = async () => {
                if (!selectedDate) return;
                const dateKey = formatDateKey(currentDate.getFullYear(), currentDate.getMonth(), selectedDate);
                try {
                    await deleteFromDB(dateKey);
                    const newPhotos = { ...photos };
                    delete newPhotos[dateKey];
                    setPhotos(newPhotos);
                } catch (error) {
                    console.error("삭제 실패", error);
                }
            };

            const prevMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1));
            const nextMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1));

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const calendarData = generateCalendar(year, month);
            const selectedDateKey = formatDateKey(year, month, selectedDate);
            const hasPhotoToday = selectedDate && photos[selectedDateKey];
            const sortedPhotoDates = Object.keys(photos).sort();
            
            const gallerySortedDates = sortedPhotoDates; 

            if (loading) return <div className="h-screen flex items-center justify-center font-bold text-[#888888]">데이터 로딩 중...</div>;

            return (
                <div className="flex flex-col h-screen font-sans overflow-hidden bg-[#f5f7fa] text-[#333333]">
                
                {/* 헤더: 배경 제거, 테두리 제거 */}
                <header className="flex items-center justify-between px-5 py-4 z-20 shrink-0 select-none bg-transparent">
                    <h1 className="text-xl font-extrabold tracking-tight flex items-center gap-2" style={{ color: COLORS.textMain }}>
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2.5} stroke="currentColor" className="w-6 h-6">
                            <path strokeLinecap="round" strokeLinejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                        </svg>
                        사진기록
                    </h1>
                    
                    {/* [수정] 토글 디자인 변경 (세그먼트 컨트롤 스타일: 회색 트랙 + 흰색 버튼) */}
                    <div className="relative flex bg-[#e0e0e0] rounded-full p-1 w-48 h-10 items-center select-none cursor-pointer">
                        {/* 슬라이딩 배경 (흰색 Pill + 그림자) */}
                        <div 
                            className={`absolute top-1 bottom-1 w-[calc(50%-4px)] bg-white rounded-full shadow-sm transition-all duration-300 ease-[cubic-bezier(0.25,0.1,0.25,1)] ${
                                viewMode === 'calendar' ? 'left-1' : 'left-[calc(50%+2px)]'
                            }`}
                        />
                        
                        {/* 텍스트 버튼 */}
                        <button 
                            onClick={() => setViewMode('calendar')}
                            className={`flex-1 z-10 text-sm font-bold text-center transition-colors duration-200 ${
                                viewMode === 'calendar' ? 'text-[#333333]' : 'text-[#888888]'
                            }`}
                        >
                            달력
                        </button>
                        <button 
                            onClick={() => setViewMode('compare')}
                            className={`flex-1 z-10 text-sm font-bold text-center transition-colors duration-200 ${
                                viewMode === 'compare' ? 'text-[#333333]' : 'text-[#888888]'
                            }`}
                        >
                            비교하기
                        </button>
                    </div>
                </header>

                <main className="flex-1 overflow-y-auto scroll-smooth">
                    
                    {/* 달력 모드 */}
                    {viewMode === 'calendar' && (
                    <div className="flex flex-col min-h-full pb-10">
                        {/* 달력 박스 */}
                        <div className="px-4 py-4 z-10">
                            <div className="bg-white rounded-3xl border border-[#e0e0e0] shadow-sm p-4 pb-6">
                                <div className="flex items-center justify-center gap-8 py-2 select-none mb-2">
                                    <button onClick={prevMonth} className="text-[#888888] hover:text-[#333333] font-bold text-2xl p-2">&lt;</button>
                                    <span className="text-xl font-extrabold" style={{ color: COLORS.textMain }}>{year}년 {month + 1}월</span>
                                    <button onClick={nextMonth} className="text-[#888888] hover:text-[#333333] font-bold text-2xl p-2">&gt;</button>
                                </div>
                                
                                <div className="grid grid-cols-7 text-center mb-3 text-sm font-bold select-none text-[#888888]">
                                    {['일', '월', '화', '수', '목', '금', '토'].map((day, idx) => (
                                        <div key={day} className={`py-1 ${idx === 0 ? 'text-red-500' : idx === 6 ? 'text-blue-500' : ''}`}>
                                            {day}
                                        </div>
                                    ))}
                                </div>
                                
                                <div className="w-full">
                                    {calendarData.map((week, i) => (
                                    <div key={i} className="grid grid-cols-7 mb-2 gap-y-1">
                                        {week.map((day, j) => {
                                        const dateKey = formatDateKey(year, month, day);
                                        const isPhoto = dateKey && photos[dateKey];
                                        const isSelected = day === selectedDate;
                                        const isTodayDate = day && isToday(day);
                                        
                                        let textColor = '#333333';
                                        if (j === 0) textColor = '#ef4444'; // red-500
                                        else if (j === 6) textColor = '#3b82f6'; // blue-500

                                        return (
                                            <div key={j} className="flex flex-col items-center justify-center h-10 sm:h-12 relative">
                                            {day && (
                                                <button onClick={() => setSelectedDate(day)} className="w-full h-full flex items-center justify-center relative group">
                                                <div className={`
                                                    w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center rounded-full text-base font-bold transition-all relative z-10 
                                                    ${isTodayDate 
                                                        ? 'bg-[#1e88e5] text-white' 
                                                        : isPhoto 
                                                            ? 'bg-[#00a86b] text-white' 
                                                            : isSelected
                                                                ? 'bg-[#1e88e5] text-white shadow-md' 
                                                                : ''
                                                    }
                                                    ${isSelected && (isTodayDate || isPhoto) ? 'ring-2 ring-offset-2 ring-[#1e88e5] scale-110' : ''} 
                                                `}
                                                style={{ color: (isTodayDate || isPhoto || isSelected) ? 'white' : textColor }}
                                                >
                                                    {day}
                                                </div>
                                                {isTodayDate && (
                                                    <span className="absolute -bottom-1 text-[9px] font-extrabold z-20 bg-white px-1 rounded-full leading-none" style={{ color: COLORS.primary }}>오늘</span>
                                                )}
                                                </button>
                                            )}
                                            </div>
                                        );
                                        })}
                                    </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="flex-1 p-0">
                        {selectedDate ? (
                            <div className="flex flex-col w-full min-h-[50vh]">
                                <div className="px-6 py-2 flex justify-between items-center">
                                    <h3 className="text-lg font-bold" style={{ color: COLORS.textMain }}>{month + 1}월 {selectedDate}일</h3>
                                </div>
                                {hasPhotoToday ? (
                                    <div className="flex flex-col gap-0 px-4">
                                        <div className="w-full bg-white rounded-2xl overflow-hidden shadow-sm border border-[#e0e0e0] relative">
                                            <img src={photos[selectedDateKey]} alt="기록" className="w-full h-auto block" />
                                        </div>
                                        
                                        {/* [수정] 사진 교체/삭제 버튼 디자인 개선 (아이콘+카드 형태) */}
                                        <div className="grid grid-cols-2 gap-3 py-6">
                                            <label className="bg-white border border-[#e0e0e0] rounded-2xl p-4 flex flex-col items-center justify-center gap-2 shadow-sm cursor-pointer active:bg-gray-50 transition-all hover:border-[#1e88e5]">
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="w-6 h-6 text-[#1e88e5]">
                                                    <path strokeLinecap="round" strokeLinejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
                                                </svg>
                                                <span className="font-bold text-sm text-[#1e88e5]">사진 교체</span>
                                                <input type="file" accept="image/*" className="hidden" onChange={handlePhotoUpload} />
                                            </label>
                                            <button onClick={handleDeletePhoto} className="bg-white border border-[#e0e0e0] rounded-2xl p-4 flex flex-col items-center justify-center gap-2 shadow-sm active:bg-red-50 transition-all hover:border-red-200">
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="w-6 h-6 text-red-500">
                                                    <path strokeLinecap="round" strokeLinejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                                                </svg>
                                                <span className="font-bold text-sm text-red-500">삭제</span>
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="flex flex-col justify-start gap-4 py-2 px-6">
                                        <div className="grid grid-cols-2 gap-4">
                                            {/* 촬영 버튼 */}
                                            <label className="flex flex-col items-center justify-center gap-2 bg-[#1e88e5] border border-[#1e88e5] hover:bg-blue-600 active:bg-blue-700 rounded-2xl p-4 cursor-pointer transition-all shadow-md h-24 sm:h-28">
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="w-8 h-8 text-white">
                                                    <path strokeLinecap="round" strokeLinejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z" />
                                                    <path strokeLinecap="round" strokeLinejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z" />
                                                </svg>
                                                <div className="font-bold text-white text-base">촬영</div>
                                                <input type="file" accept="image/*" capture="environment" className="hidden" onChange={handlePhotoUpload} />
                                            </label>
                                            {/* 앨범 버튼 */}
                                            <label className="flex flex-col items-center justify-center gap-2 bg-[#1e88e5] border border-[#1e88e5] hover:bg-blue-600 active:bg-blue-700 rounded-2xl p-4 cursor-pointer transition-all shadow-md h-24 sm:h-28">
                                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="w-8 h-8 text-white">
                                                    <path strokeLinecap="round" strokeLinejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                                                </svg>
                                                <div className="font-bold text-white text-base">앨범</div>
                                                <input type="file" accept="image/*" className="hidden" onChange={handlePhotoUpload} />
                                            </label>
                                        </div>
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div className="h-40 flex flex-col items-center justify-center font-medium" style={{ color: COLORS.textSub }}>날짜를 선택해주세요</div>
                        )}
                        </div>
                    </div>
                    )}

                    {/* 비교 모드 */}
                    {viewMode === 'compare' && (
                    <div className="flex flex-col min-h-full pb-10">
                        <div className="flex p-3 bg-white border-b border-[#e0e0e0] z-10 sticky top-0 shrink-0 gap-2 shadow-sm">
                            <button 
                                onClick={() => setCompareMode('gallery')} 
                                className={`flex-1 py-3 text-sm font-bold rounded-xl transition-colors border ${
                                    compareMode === 'gallery' 
                                    ? 'bg-[#1e88e5] text-white border-[#1e88e5]' 
                                    : 'bg-white text-[#1e88e5] border-[#1e88e5]'
                                }`}
                            >
                                슬라이드 뷰
                            </button>
                            <button 
                                onClick={() => setCompareMode('split')} 
                                className={`flex-1 py-3 text-sm font-bold rounded-xl transition-colors border ${
                                    compareMode === 'split' 
                                    ? 'bg-[#1e88e5] text-white border-[#1e88e5]' 
                                    : 'bg-white text-[#1e88e5] border-[#1e88e5]'
                                }`}
                            >
                                1:1 비교
                            </button>
                        </div>
                        {Object.keys(photos).length === 0 ? (
                        <div className="flex-1 flex flex-col items-center justify-center gap-4 min-h-[50vh]" style={{ color: COLORS.textSub }}><p className="font-bold">기록된 사진이 없습니다</p></div>
                        ) : (
                        <>
                            {compareMode === 'gallery' && (
                            <div 
                                ref={scrollRef}
                                className="flex-1 overflow-x-auto flex items-center gap-6 p-6 snap-x snap-mandatory scrollbar-hide h-full"
                            >
                                {gallerySortedDates.map((date) => (
                                <div key={date} className="snap-center shrink-0 w-[85vw] max-w-md h-[70vh] flex flex-col relative">
                                    <div className="flex justify-center mb-4">
                                        <span className="font-extrabold text-lg tracking-wide bg-white px-4 py-1 rounded-full shadow-sm border border-[#e0e0e0]" style={{ color: COLORS.textSub }}>
                                            {date}
                                        </span>
                                    </div>
                                    <div className="flex-1 bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] overflow-hidden flex items-center justify-center border border-[#e0e0e0]">
                                        <img src={photos[date]} alt={date} className="w-full h-full object-cover" />
                                    </div>
                                </div>
                                ))}
                            </div>
                            )}
                            {compareMode === 'split' && (
                            <div className="flex flex-col gap-4 p-4">
                                <div className="flex gap-2 w-full h-[50vh] min-h-[300px]">
                                {[0, 1].map((idx) => (
                                    /* 빈 박스 스타일: 주조색 점선 테두리 */
                                    <div key={idx} className={`flex-1 bg-white rounded-2xl overflow-hidden flex flex-col relative shadow-sm ${!splitSelection[idx] ? 'border-2 border-dashed border-[#1e88e5]' : 'border border-[#e0e0e0]'}`}>
                                    {splitSelection[idx] ? (
                                        <>
                                        <img src={photos[splitSelection[idx]]} className="w-full h-full object-contain bg-black" alt="" />
                                        <div className="absolute top-3 left-3 bg-black/70 text-white text-[10px] px-2 py-1 rounded-md font-bold">{splitSelection[idx]}</div>
                                        <button onClick={() => { const newSel = [...splitSelection]; newSel[idx] = null; setSplitSelection(newSel); }} className="absolute top-3 right-3 bg-white shadow-sm w-6 h-6 flex items-center justify-center rounded-full text-black font-bold text-xs">X</button>
                                        </>
                                    ) : (
                                        <div className="flex-1 flex flex-col items-center justify-center gap-1">
                                            <span className="text-sm font-medium" style={{ color: '#555555' }}>사진 선택 {idx + 1}</span>
                                        </div>
                                    )}
                                    </div>
                                ))}
                                </div>
                                <div className="bg-white rounded-2xl border border-[#e0e0e0] p-4 flex flex-col shadow-sm">
                                <p className="text-xs mb-3 font-bold px-1" style={{ color: COLORS.textSub }}>비교할 사진 선택</p>
                                <div className="grid grid-cols-2 gap-3">
                                    {sortedPhotoDates.map((date) => {
                                    const isSelected = splitSelection.includes(date);
                                    return (
                                        <button key={date} disabled={isSelected} onClick={() => { const emptyIndex = splitSelection.indexOf(null); if (emptyIndex !== -1) { const newSel = [...splitSelection]; newSel[emptyIndex] = date; setSplitSelection(newSel); } else { setSplitSelection([splitSelection[1], date]); } }} className={`relative aspect-[9/16] rounded-xl overflow-hidden transition-all border bg-[#f5f7fa] group ${isSelected ? 'opacity-40 border-[#e0e0e0]' : 'border-transparent hover:border-[#e0e0e0] shadow-sm'}`}>
                                            <img src={photos[date]} alt={date} className="w-full h-full object-contain" />
                                            <div className="absolute inset-x-0 bottom-0 bg-black/60 text-white text-sm font-bold py-2 text-center backdrop-blur-sm">
                                                {date}
                                            </div>
                                            {isSelected && (
                                                <div className="absolute inset-0 flex items-center justify-center bg-black/20">
                                                    <span className="bg-black text-white text-xs px-2 py-1 rounded-full">선택됨</span>
                                                </div>
                                            )}
                                        </button>
                                    );
                                    })}
                                </div>
                                </div>
                            </div>
                            )}
                        </>
                        )}
                    </div>
                    )}
                </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
