<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>사진기록</title>
    
    <!-- React & ReactDOM (CDN) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (JSX 변환용 CDN) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS (스타일링 CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 스타일 커스터마이징 -->
    <style>
        /* 스크롤바 숨기기 */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* 체크무늬 배경 (투명 이미지 표시용) */
        .bg-checkered {
            background-image: linear-gradient(45deg, #f0f0f0 25%, transparent 25%), 
                              linear-gradient(-45deg, #f0f0f0 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #f0f0f0 75%), 
                              linear-gradient(-45deg, transparent 75%, #f0f0f0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
    </style>
</head>
<body class="bg-gray-100 touch-pan-y">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 아이콘 컴포넌트 (Lucide 아이콘을 SVG로 직접 구현) ---
        const IconBase = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Camera = (props) => (
            <IconBase {...props}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></IconBase>
        );
        const CalendarIcon = (props) => (
            <IconBase {...props}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></IconBase>
        );
        const ChevronLeft = (props) => (
            <IconBase {...props}><polyline points="15 18 9 12 15 6"/></IconBase>
        );
        const ChevronRight = (props) => (
            <IconBase {...props}><polyline points="9 18 15 12 9 6"/></IconBase>
        );
        const X = (props) => (
            <IconBase {...props}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconBase>
        );
        const ImageIcon = (props) => (
            <IconBase {...props}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></IconBase>
        );
        const Layers = (props) => (
            <IconBase {...props}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></IconBase>
        );
        const Trash2 = (props) => (
            <IconBase {...props}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></IconBase>
        );
        const ArrowLeftRight = (props) => (
            <IconBase {...props}><polyline points="8 3 4 7 8 11"/><path d="M4 7h16"/><polyline points="16 21 20 17 16 13"/><path d="M20 17H4"/></IconBase>
        );
        const Aperture = (props) => (
            <IconBase {...props}><circle cx="12" cy="12" r="10"/><line x1="14.31" y1="8" x2="20.05" y2="17.94"/><line x1="9.69" y1="8" x2="21.17" y2="8"/><line x1="7.38" y1="12" x2="13.12" y2="2.06"/><line x1="9.69" y1="16" x2="3.95" y2="6.06"/><line x1="14.31" y1="16" x2="2.83" y2="16"/><line x1="16.62" y1="12" x2="10.88" y2="21.94"/></IconBase>
        );

        // --- 유틸리티 함수 ---
        const generateCalendar = (year, month) => {
            const startDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const calendar = [];
            let week = Array(startDay).fill(null);

            for (let day = 1; day <= daysInMonth; day++) {
                week.push(day);
                if (week.length === 7) {
                    calendar.push(week);
                    week = [];
                }
            }
            if (week.length > 0) {
                while (week.length < 7) week.push(null);
                calendar.push(week);
            }
            return calendar;
        };

        const formatDateKey = (year, month, day) => {
            if (!day) return null;
            return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        };

        // --- 메인 컴포넌트 ---
        function App() {
            // 상태 관리
            const [currentDate, setCurrentDate] = useState(new Date());
            const [selectedDate, setSelectedDate] = useState(new Date().getDate()); // 기본값: 오늘 날짜
            const [photos, setPhotos] = useState({}); 
            const [viewMode, setViewMode] = useState('calendar'); // 'calendar', 'compare'
            
            // 비교 모드 상태
            const [compareMode, setCompareMode] = useState('gallery'); 
            const [splitSelection, setSplitSelection] = useState([null, null]); 

            // 오늘 날짜 확인용
            const today = new Date();
            const isToday = (day) => {
                return day === today.getDate() && 
                    currentDate.getMonth() === today.getMonth() && 
                    currentDate.getFullYear() === today.getFullYear();
            };

            // 로컬 스토리지 로드
            useEffect(() => {
                const savedPhotos = localStorage.getItem('photoLog_data');
                if (savedPhotos) {
                    try {
                        setPhotos(JSON.parse(savedPhotos));
                    } catch (e) {
                        console.error("데이터 로드 실패", e);
                    }
                }
            }, []);

            // 사진 저장 로직
            const handlePhotoUpload = (e) => {
                const file = e.target.files[0];
                if (!file || !selectedDate) return;

                const reader = new FileReader();
                reader.onloadend = () => {
                    const dateKey = formatDateKey(currentDate.getFullYear(), currentDate.getMonth(), selectedDate);
                    const newPhotos = { ...photos, [dateKey]: reader.result };
                    setPhotos(newPhotos);
                    localStorage.setItem('photoLog_data', JSON.stringify(newPhotos));
                };
                reader.readAsDataURL(file);
            };

            const handleDeletePhoto = () => {
                if (!selectedDate) return;
                const dateKey = formatDateKey(currentDate.getFullYear(), currentDate.getMonth(), selectedDate);
                const newPhotos = { ...photos };
                delete newPhotos[dateKey];
                setPhotos(newPhotos);
                localStorage.setItem('photoLog_data', JSON.stringify(newPhotos));
            };

            // 달력 네비게이션
            const prevMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1));
            const nextMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1));

            // 렌더링 헬퍼
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const calendarData = generateCalendar(year, month);
            const selectedDateKey = formatDateKey(year, month, selectedDate);
            const hasPhotoToday = selectedDate && photos[selectedDateKey];
            const sortedPhotoDates = Object.keys(photos).sort();

            return (
                <div className="flex flex-col h-screen bg-white text-gray-800 font-sans overflow-hidden">
                
                {/* --- 상단 헤더 (고정) --- */}
                <header className="flex items-center justify-between px-5 py-3 bg-white border-b border-gray-100 z-20 shrink-0 select-none">
                    <h1 className="text-xl font-bold text-gray-900 flex items-center gap-2">
                    📸 사진기록
                    </h1>
                    {viewMode === 'calendar' && (
                    <button 
                        onClick={() => setViewMode('compare')}
                        className="text-sm bg-gray-100 text-gray-700 px-3 py-1.5 rounded-full font-medium flex items-center gap-1 active:bg-gray-200 transition-colors"
                    >
                        <Layers size={16} />
                        비교하기
                    </button>
                    )}
                    {viewMode === 'compare' && (
                    <button 
                        onClick={() => setViewMode('calendar')}
                        className="text-sm bg-gray-100 text-gray-600 px-3 py-1.5 rounded-full font-medium flex items-center gap-1"
                    >
                        <CalendarIcon size={16} />
                        달력으로
                    </button>
                    )}
                </header>

                {/* --- 메인 콘텐츠 영역 (전체 스크롤 가능) --- */}
                <main className="flex-1 overflow-y-auto scroll-smooth">
                    
                    {/* VIEW 1: 달력 모드 */}
                    {viewMode === 'calendar' && (
                    <div className="flex flex-col min-h-full pb-10">
                        
                        {/* 1. 달력 영역 */}
                        <div className="bg-white px-4 pt-2 pb-6 shadow-sm z-10">
                        {/* 달력 컨트롤 */}
                        <div className="flex items-center justify-center gap-6 py-2 select-none">
                            <button onClick={prevMonth} className="p-1 text-gray-400 hover:text-gray-800"><ChevronLeft size={24} /></button>
                            <span className="text-lg font-bold text-gray-800">{year}년 {month + 1}월</span>
                            <button onClick={nextMonth} className="p-1 text-gray-400 hover:text-gray-800"><ChevronRight size={24} /></button>
                        </div>

                        {/* 요일 헤더 */}
                        <div className="grid grid-cols-7 text-center mb-2 text-gray-400 text-xs font-medium select-none">
                            {['일', '월', '화', '수', '목', '금', '토'].map(day => (
                            <div key={day} className="py-1">{day}</div>
                            ))}
                        </div>

                        {/* 달력 그리드 */}
                        <div className="w-full">
                            {calendarData.map((week, i) => (
                            <div key={i} className="grid grid-cols-7 mb-1 gap-y-1">
                                {week.map((day, j) => {
                                const dateKey = formatDateKey(year, month, day);
                                const isPhoto = dateKey && photos[dateKey];
                                const isSelected = day === selectedDate;
                                const isTodayDate = day && isToday(day);
                                
                                return (
                                    <div key={j} className="flex flex-col items-center justify-center h-10 sm:h-12 relative">
                                    {day && (
                                        <button
                                        onClick={() => setSelectedDate(day)}
                                        className="w-full h-full flex items-center justify-center relative group"
                                        >
                                        <div className={`
                                            w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center rounded-full text-sm font-medium transition-all relative z-10
                                            ${isTodayDate 
                                            ? 'bg-purple-600 text-white font-bold' 
                                            : isPhoto 
                                                ? 'bg-green-400 text-white font-bold' 
                                                : 'text-gray-700' 
                                            }
                                            ${isSelected && !isTodayDate && !isPhoto ? 'bg-gray-100 ring-1 ring-gray-300' : ''} 
                                            ${isSelected && (isTodayDate || isPhoto) ? 'ring-2 ring-offset-2 ring-gray-400 scale-105' : ''}
                                        `}>
                                            {day}
                                        </div>
                                        {isTodayDate && (
                                            <span className="absolute -bottom-1 text-[9px] text-purple-600 font-bold z-20 bg-white px-0.5 rounded-full leading-none">오늘</span>
                                        )}
                                        </button>
                                    )}
                                    </div>
                                );
                                })}
                            </div>
                            ))}
                        </div>
                        </div>

                        {/* 2. 사진/업로드 영역 */}
                        <div className="flex-1 bg-gray-50 border-t border-gray-200 p-4">
                        {selectedDate ? (
                            <div className="flex flex-col max-w-md mx-auto min-h-[50vh]">
                            <div className="flex justify-between items-center mb-4 mt-2">
                                <h3 className="text-base font-bold text-gray-800 flex items-center gap-2">
                                📅 {month + 1}월 {selectedDate}일의 기록
                                </h3>
                            </div>

                            {hasPhotoToday ? (
                                // 사진이 있을 때
                                <div className="flex flex-col gap-4">
                                <div className="w-full bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden relative">
                                    <img src={photos[selectedDateKey]} alt="기록" className="w-full h-auto object-contain max-h-[60vh] mx-auto bg-checkered" />
                                </div>
                                
                                <div className="flex gap-2 shrink-0 pb-8">
                                    <label className="flex-1 bg-white border border-gray-300 text-gray-700 py-3 rounded-xl font-bold text-sm flex items-center justify-center gap-2 cursor-pointer active:bg-gray-100 transition-colors shadow-sm">
                                    <ArrowLeftRight size={16} />
                                    사진 교체
                                    <input type="file" accept="image/*" className="hidden" onChange={handlePhotoUpload} />
                                    </label>
                                    <button 
                                    onClick={handleDeletePhoto} 
                                    className="flex-1 bg-red-50 border border-red-100 text-red-600 py-3 rounded-xl font-bold text-sm flex items-center justify-center gap-2 active:bg-red-100 transition-colors shadow-sm"
                                    >
                                    <Trash2 size={16} />
                                    삭제
                                    </button>
                                </div>
                                </div>
                            ) : (
                                // 사진이 없을 때 (업로드)
                                <div className="flex flex-col justify-center gap-6 py-4">
                                <p className="text-center text-gray-500 text-sm">📸 오늘의 사진을 남겨보세요!</p>
                                <div className="grid grid-cols-2 gap-4">
                                    <label className="flex flex-col items-center justify-center gap-3 bg-white hover:bg-indigo-50 active:bg-indigo-100 border border-gray-200 rounded-2xl p-6 cursor-pointer transition-all shadow-sm h-36 sm:h-44">
                                    <div className="w-12 h-12 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center">
                                        <Camera size={24} />
                                    </div>
                                    <span className="font-bold text-gray-700 text-sm">카메라 촬영</span>
                                    <input type="file" accept="image/*" capture="environment" className="hidden" onChange={handlePhotoUpload} />
                                    </label>

                                    <label className="flex flex-col items-center justify-center gap-3 bg-white hover:bg-green-50 active:bg-green-100 border border-gray-200 rounded-2xl p-6 cursor-pointer transition-all shadow-sm h-36 sm:h-44">
                                    <div className="w-12 h-12 rounded-full bg-green-100 text-green-600 flex items-center justify-center">
                                        <ImageIcon size={24} />
                                    </div>
                                    <span className="font-bold text-gray-700 text-sm">앨범 선택</span>
                                    <input type="file" accept="image/*" className="hidden" onChange={handlePhotoUpload} />
                                    </label>
                                </div>
                                </div>
                            )}
                            </div>
                        ) : (
                            <div className="h-40 flex flex-col items-center justify-center text-gray-400">
                            <p>날짜를 선택해주세요 👆</p>
                            </div>
                        )}
                        </div>
                    </div>
                    )}

                    {/* VIEW 2: 비교 모드 (스크롤 가능) */}
                    {viewMode === 'compare' && (
                    <div className="flex flex-col min-h-full bg-gray-50 pb-10">
                        {/* 비교 모드 탭 (Sticky) */}
                        <div className="flex p-2 bg-white shadow-sm z-10 sticky top-0 shrink-0">
                        <button 
                            onClick={() => setCompareMode('gallery')}
                            className={`flex-1 py-2.5 text-sm font-bold rounded-lg transition-colors ${compareMode === 'gallery' ? 'bg-black text-white' : 'text-gray-400 hover:bg-gray-50'}`}
                        >
                            🖼️ 앨범 뷰
                        </button>
                        <button 
                            onClick={() => setCompareMode('split')}
                            className={`flex-1 py-2.5 text-sm font-bold rounded-lg transition-colors ${compareMode === 'split' ? 'bg-black text-white' : 'text-gray-400 hover:bg-gray-50'}`}
                        >
                            ⚖️ 비교 뷰
                        </button>
                        </div>

                        {Object.keys(photos).length === 0 ? (
                        <div className="flex-1 flex flex-col items-center justify-center text-gray-300 gap-4 min-h-[50vh]">
                            <Aperture size={64} strokeWidth={1} />
                            <p className="font-medium">기록된 사진이 없습니다 😅</p>
                        </div>
                        ) : (
                        <>
                            {/* 갤러리/슬라이드 모드 */}
                            {compareMode === 'gallery' && (
                            <div className="flex-1 overflow-x-auto flex items-center gap-4 p-6 snap-x snap-mandatory scrollbar-hide min-h-[70vh]">
                                {sortedPhotoDates.map((date) => (
                                <div key={date} className="snap-center shrink-0 w-full max-w-[320px] h-[65vh] bg-white rounded-3xl shadow-lg flex flex-col overflow-hidden border border-gray-100">
                                    <div className="p-4 text-center font-bold text-gray-800 border-b border-gray-100">
                                    {date}
                                    </div>
                                    <div className="flex-1 bg-gray-50 flex items-center justify-center relative overflow-hidden">
                                    <img src={photos[date]} alt={date} className="w-full h-full object-contain" />
                                    </div>
                                </div>
                                ))}
                            </div>
                            )}

                            {/* 1:1 비교 모드 (스크롤 가능) */}
                            {compareMode === 'split' && (
                            <div className="flex flex-col gap-4 p-4">
                                
                                {/* 상단 비교 영역 (충분한 높이 확보) */}
                                <div className="flex gap-2 w-full h-[50vh] min-h-[300px]">
                                {[0, 1].map((idx) => (
                                    <div key={idx} className="flex-1 bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex flex-col relative">
                                    {splitSelection[idx] ? (
                                        <>
                                        <img src={photos[splitSelection[idx]]} className="w-full h-full object-contain bg-gray-50" alt="" />
                                        <div className="absolute top-2 left-2 bg-black/60 backdrop-blur-sm text-white text-[10px] px-2 py-1 rounded-full font-bold">
                                            {splitSelection[idx]}
                                        </div>
                                        <button 
                                            onClick={() => {
                                            const newSel = [...splitSelection];
                                            newSel[idx] = null;
                                            setSplitSelection(newSel);
                                            }}
                                            className="absolute top-2 right-2 bg-white/90 p-1 rounded-full shadow-sm hover:bg-white text-gray-700"
                                        >
                                            <X size={12} />
                                        </button>
                                        </>
                                    ) : (
                                        <div className="flex-1 flex flex-col items-center justify-center text-gray-300 gap-1 bg-gray-50">
                                        <span className="text-xs font-bold text-gray-400">선택 {idx + 1}</span>
                                        </div>
                                    )}
                                    </div>
                                ))}
                                </div>

                                {/* 하단 선택 리스트 */}
                                <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-4 flex flex-col">
                                <p className="text-xs text-gray-500 mb-3 font-bold px-1">👇 비교할 사진 선택</p>
                                <div className="grid grid-cols-4 gap-2">
                                    {sortedPhotoDates.map((date) => {
                                    const isSelected = splitSelection.includes(date);
                                    return (
                                        <button 
                                        key={date}
                                        disabled={isSelected}
                                        onClick={() => {
                                            const emptyIndex = splitSelection.indexOf(null);
                                            if (emptyIndex !== -1) {
                                            const newSel = [...splitSelection];
                                            newSel[emptyIndex] = date;
                                            setSplitSelection(newSel);
                                            } else {
                                            setSplitSelection([splitSelection[1], date]);
                                            }
                                        }}
                                        className={`
                                            relative aspect-square rounded-lg overflow-hidden transition-all border bg-gray-100
                                            ${isSelected ? 'opacity-40 border-gray-200' : 'border-transparent hover:border-indigo-300'}
                                        `}
                                        >
                                        <img src={photos[date]} alt={date} className="w-full h-full object-contain" />
                                        </button>
                                    );
                                    })}
                                </div>
                                </div>
                            </div>
                            )}
                        </>
                        )}
                    </div>
                    )}
                </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
